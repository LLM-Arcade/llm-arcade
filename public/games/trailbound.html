<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trailbound</title>
<style>
  :root {
    --paper: #f6f1e7;
    --soil: #221b12;
    --card: #2b2318;
    --terra: #c0623b;
    --olive: #93a26b;
    --mustard: #d9a441;
    --line: rgba(246, 241, 231, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--soil);
    color: var(--paper);
    font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    -webkit-user-select: none;
    user-select: none;
  }
  #app {
    height: 100%;
    max-width: 780px;
    margin: 0 auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  /* top bar */
  #top {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 11px;
    letter-spacing: 0.12em;
    padding: 2px 6px;
  }
  #top .spacer { margin-left: auto; }
  #mute {
    background: none;
    border: 1px solid var(--line);
    color: var(--paper);
    border-radius: 999px;
    font: inherit;
    padding: 3px 10px;
    cursor: pointer;
  }
  .mustard { color: var(--mustard); }
  .olive { color: var(--olive); }
  .terra { color: #e08a63; }
  .dim { color: rgba(246, 241, 231, 0.55); }

  /* scene */
  #scene {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--line);
    aspect-ratio: 16 / 7;
    min-height: 130px;
    background-color: #3a3020;
    background-repeat: no-repeat;
    flex: none;
  }
  .region-layer, #sceneEvent {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .region-layer {
    background-repeat: no-repeat;
    background-position: 0 100%;
    background-size: 138% auto;
    transition: opacity 0.7s ease, background-position 0.64s linear;
  }
  #regionB { opacity: 0; }
  #sceneEvent {
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.45s ease;
    z-index: 2;
  }
  #scene.event-mode #sceneEvent { opacity: 1; }
  #scene.event-mode #wagon { opacity: 0; }
  #wagon {
    position: absolute;
    left: 12%;
    bottom: 4%;
    height: 34%;
    image-rendering: auto;
    transition: transform 0.3s;
    z-index: 1;
  }
  .rolling #wagon { animation: bob 0.55s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-0.6deg); }
    50% { transform: translateY(-3.5%) rotate(0.6deg); }
  }
  #weatherchip {
    position: absolute;
    top: 8px;
    right: 8px;
    font-size: 10px;
    letter-spacing: 0.14em;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(34, 27, 18, 0.72);
    border: 1px solid var(--line);
    z-index: 4;
  }
  #scene .shade {
    position: absolute;
    inset: 0;
    background: rgba(34, 27, 18, 0);
    transition: background 0.8s;
    pointer-events: none;
    z-index: 3;
  }
  #scene.gloom .shade { background: rgba(34, 27, 18, 0.38); }

  /* trail progress */
  #trail { padding: 0 4px; flex: none; }
  #trackline {
    position: relative;
    height: 14px;
  }
  #trackline .rail {
    position: absolute;
    left: 0; right: 0; top: 6px;
    height: 3px;
    border-radius: 999px;
    background: var(--line);
  }
  #trackline .fill {
    position: absolute;
    left: 0; top: 6px;
    height: 3px;
    border-radius: 999px;
    background: var(--terra);
  }
  .tick {
    position: absolute;
    top: 3px;
    width: 9px;
    height: 9px;
    border-radius: 999px;
    background: var(--soil);
    border: 2px solid rgba(246, 241, 231, 0.4);
    transform: translateX(-50%);
  }
  .tick.done { background: var(--terra); border-color: var(--terra); }
  #trailmeta {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    letter-spacing: 0.1em;
    margin-top: 3px;
    color: rgba(246, 241, 231, 0.6);
  }

  /* party + supplies */
  #party { display: flex; flex-wrap: wrap; gap: 6px; flex: none; }
  .member {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 11px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    font-size: 11px;
  }
  .member.dead { opacity: 0.38; }
  .member.dead .nm { text-decoration: line-through; }
  .hpbar {
    width: 30px;
    height: 4px;
    border-radius: 999px;
    background: rgba(246, 241, 231, 0.15);
    overflow: hidden;
  }
  .hpbar i { display: block; height: 100%; border-radius: 999px; background: var(--olive); }
  .hpbar i.warn { background: var(--mustard); }
  .hpbar i.low { background: var(--terra); }

  #supplies {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 14px;
    font-size: 11px;
    letter-spacing: 0.06em;
    padding: 2px 4px;
    flex: none;
  }
  .seg { display: flex; gap: 3px; align-items: center; }
  .seg .lbl { font-size: 9px; letter-spacing: 0.14em; color: rgba(246,241,231,0.5); margin-right: 2px; }
  .pill {
    background: none;
    border: 1px solid var(--line);
    color: rgba(246, 241, 231, 0.7);
    border-radius: 999px;
    font: inherit;
    font-size: 10px;
    padding: 3px 9px;
    cursor: pointer;
  }
  .pill.on { background: var(--paper); color: var(--soil); border-color: var(--paper); font-weight: 700; }

  /* log */
  #log {
    flex: 1 1 0;
    min-height: 52px;
    overflow: hidden;
    padding: 7px 12px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--card);
    font-size: 11.5px;
    line-height: 1.5;
  }
  #log p { margin: 0; }
  #log p:nth-child(2) { opacity: 0.65; }
  #log p:nth-child(3) { opacity: 0.4; }
  #log p:nth-child(4) { opacity: 0.22; }

  /* actions */
  #actions { display: flex; gap: 8px; flex: none; padding-bottom: 2px; }
  .btn {
    flex: 1;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--paper);
    font: inherit;
    font-size: 12px;
    letter-spacing: 0.1em;
    padding: 12px 8px;
    border-radius: 999px;
    cursor: pointer;
  }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn.primary { background: var(--terra); border-color: var(--terra); font-weight: 700; }
  .btn.trade { background: var(--mustard); border-color: var(--mustard); color: var(--soil); font-weight: 700; }

  /* modal */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(20, 16, 10, 0.72);
    padding: 18px;
  }
  #overlay.open { display: flex; }
  #modal {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 18px;
  }
  #modal h2 {
    margin: 0 0 6px;
    font-size: 15px;
    letter-spacing: 0.08em;
  }
  #modal .body { font-size: 12px; line-height: 1.55; color: rgba(246,241,231,0.8); margin-bottom: 14px; }
  #modal .event-art {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 7;
    object-fit: cover;
    margin: 0 0 12px;
    border: 1px solid var(--line);
  }
  #modal .choices { display: flex; flex-direction: column; gap: 8px; }

  /* hunt */
  #hunttrack {
    position: relative;
    height: 26px;
    border-radius: 999px;
    background: rgba(246, 241, 231, 0.1);
    overflow: hidden;
    margin: 10px 0 4px;
  }
  #hunttrack .zone { position: absolute; top: 0; bottom: 0; }
  #hunttrack .z-ok { background: rgba(217, 164, 65, 0.25); }
  #hunttrack .z-good { background: rgba(147, 162, 107, 0.4); }
  #hunttrack .z-perfect { background: var(--olive); }
  #huntmarker {
    position: absolute;
    top: -2px;
    bottom: -2px;
    width: 4px;
    border-radius: 2px;
    background: var(--paper);
    transform: translateX(-50%);
  }
  .endnums { font-size: 12px; line-height: 1.7; }
  .endnums b { color: var(--mustard); }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span>DAY <b id="tDay">1</b></span>
    <span>MILE <b id="tMile">0</b><span class="dim">/1120</span></span>
    <span class="mustard">GOLD <b id="tGold">120</b></span>
    <span class="spacer"></span>
    <button id="mute" type="button">SOUND ON</button>
  </div>

  <div id="scene">
    <div class="region-layer" id="regionA"></div>
    <div class="region-layer" id="regionB"></div>
    <img id="sceneEvent" alt="" />
    <div class="shade"></div>
    <img id="wagon" alt="" />
    <div id="weatherchip">CLEAR</div>
  </div>

  <div id="trail">
    <div id="trackline"><div class="rail"></div><div class="fill" id="tFill"></div></div>
    <div id="trailmeta"><span id="tPrev">Split Creek</span><span id="tNext">Fort Bramble · 140 mi</span></div>
  </div>

  <div id="party"></div>

  <div id="supplies">
    <span>FOOD <b id="tFood" class="olive">320</b> lb</span>
    <span>SPARES <b id="tSpares">3</b></span>
    <span>TONICS <b id="tMeds">2</b></span>
    <span class="seg"><span class="lbl">PACE</span><span id="segPace"></span></span>
    <span class="seg"><span class="lbl">RATIONS</span><span id="segRat"></span></span>
  </div>

  <div id="log"></div>

  <div id="actions">
    <button class="btn primary" id="btnGo" type="button">SET OUT</button>
    <button class="btn" id="btnRest" type="button">REST</button>
    <button class="btn" id="btnHunt" type="button">HUNT</button>
    <button class="btn trade" id="btnTrade" type="button" style="display:none">TRADE</button>
  </div>
</div>

<div id="overlay"><div id="modal"></div></div>

  { name: "Scant", lb: 1, hp: -2 },
  { name: "Meager", lb: 2, hp: 0 },
  { name: "Filling", lb: 3, hp: 2 },
];
const LANDMARKS = [
  { mile: 140, name: "Fort Bramble", type: "fort" },
  { mile: 290, name: "Copper River", type: "river", depth: 3.4 },
  { mile: 430, name: "Ash Flats", type: "scenic" },
  { mile: 560, name: "Fort Marigold", type: "fort", ach: "halfway-there" },
  { mile: 700, name: "Sorrel Pass", type: "scenic" },
  { mile: 840, name: "Rust River", type: "river", depth: 5.2 },
  { mile: 980, name: "Fort Juniper", type: "fort" },
  { mile: END, name: "Golden Valley", type: "end" },
];

const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[ri(0, arr.length - 1)];

// ---- State -----------------------------------------------------------------
const S = {
  day: 1, mile: 0, gold: 120, food: 320, spares: 3, meds: 2,
  pace: 0, rations: 1,
  party: NAMES.map((n) => ({ name: n, hp: 100, alive: true })),
  weather: "Clear", wmod: 1,
  traveling: false, timer: null,
  atFort: null, over: false,
  everSetOut: false, fordedClean: false, starveLogged: false,
};

// ---- Helpers -----------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const alive = () => S.party.filter((p) => p.alive);
const logs = [];
const log = (text, tone) => {
  logs.unshift({ text, tone: tone || "" });
  if (logs.length > 8) logs.pop();
  $("log").innerHTML = logs
    .slice(0, 4)
    .map((l) => '<p class="' + l.tone + '">' + l.text + "</p>")
    .join("");
};

const halt = () => {
  S.traveling = false;
  if (S.timer) { clearInterval(S.timer); S.timer = null; }
  render();
};

// ---- Modal -----------------------------------------------------------------
const modalOpen = () => $("overlay").classList.contains("open");
const closeModal = () => $("overlay").classList.remove("open");
const showModal = (title, body, choices, art = "") => {
  halt();
  const m = $("modal");
  m.innerHTML = (art ? '<img class="event-art" src="' + art + '" alt="">' : "") +
    "<h2>" + title + '</h2><div class="body">' + body + '</div><div class="choices"></div>';
  const box = m.querySelector(".choices");
  for (const c of choices) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "btn" + (c.primary ? " primary" : "");
    b.textContent = c.label;
    if (c.disabled) b.disabled = true;
    b.onclick = () => { closeModal(); c.fn(); };
    box.appendChild(b);
  }
  $("overlay").classList.add("open");
};

// ---- Weather -----------------------------------------------------------------
const rollWeather = () => {
  const mountains = S.mile >= 640 && S.mile < 1000;
  const r = Math.random();
  let w;
  if (mountains) {
    w = r < 0.4 ? ["Clear", 1] : r < 0.6 ? ["Overcast", 0.9] : r < 0.7 ? ["Rain", 0.6] : r < 0.9 ? ["Snow", 0.5] : ["Storm", 0];
  } else {
    w = r < 0.55 ? ["Clear", 1] : r < 0.75 ? ["Overcast", 0.9] : r < 0.9 ? ["Rain", 0.6] : r < 0.97 ? ["Storm", 0] : ["Heat", 0.85];
  }
  S.weather = w[0];
  S.wmod = w[1];
};

// ---- Health / deaths -----------------------------------------------------------------
const hurt = (member, amount) => {
  member.hp = Math.max(0, member.hp - amount);
  if (member.hp === 0 && member.alive) {
    member.alive = false;
    log(member.name + " was laid to rest beside the trail.", "terra");
    SND.death();
    if (alive().length === 0) endGame(false);
  }
};

// ---- Day tick -----------------------------------------------------------------
const dayTick = (travel) => {
  if (S.over) return;
  S.day++;
  rollWeather();

  // eat
  const need = alive().length * RATIONS[S.rations].lb;
  let hpFood = RATIONS[S.rations].hp;
  if (S.food >= need) {
    S.food -= need;
    S.starveLogged = false;
  } else {
    S.food = 0;
    hpFood = -8;
    if (!S.starveLogged) { log("The food ran out. Empty bellies on the trail.", "terra"); S.starveLogged = true; }
  }

  // wear and tear
  const strain = travel ? PACES[S.pace].strain : 0;
  const wHp = S.weather === "Snow" ? 3 : S.weather === "Heat" ? 2 : 0;
  for (const p of [...alive()]) {
    p.hp = Math.min(100, p.hp + hpFood);
    hurt(p, strain + wHp);
    if (S.over) return;
  }

  if (travel) {
    if (S.wmod === 0) {
      log("A storm pins the wagon down. No ground gained.", "dim");
      SND.bad();
    } else {
      S.mile += Math.round(PACES[S.pace].mi * S.wmod);
      SND.step();
    }

    // landmark?
    const lm = LANDMARKS.find((l) => !l.done && S.mile >= l.mile);
    if (lm) {
      S.mile = lm.mile;
      lm.done = true;
      if (lm.ach) fire(lm.ach);
      if (lm.type === "end") { render(); endGame(true); return; }
      if (lm.type === "fort") {
        S.atFort = lm;
        halt();
        log("You roll into " + lm.name + ". The trader waves you over.", "mustard");
        SND.good();
      } else if (lm.type === "river") {
        halt();
        riverModal(lm);
      } else {
        log(lm.name + ". The view is worth a moment's rest.", "olive");
      }
    } else if (Math.random() < 0.24) {
      randomEvent();
    }
  }
  render();
};

// ---- Events -----------------------------------------------------------------
const randomEvent = () => {
  const mountains = S.mile >= 640;
  const table = [];
  const add = (weight, fn) => { for (let i = 0; i < weight; i++) table.push(fn); };

  add(3, () => {
    const m = pick(alive());
    SND.event();
    showModal("Trail Fever", m.name + " burns with trail fever and can barely sit upright.", [
      { label: "USE A TONIC (" + S.meds + " LEFT)", primary: true, disabled: S.meds <= 0, fn: () => { S.meds--; log(m.name + " sweats out the fever by morning.", "olive"); SND.good(); render(); } },
      { label: "TOUGH IT OUT", fn: () => { hurt(m, 25); if (!S.over) log(m.name + " rides it out the hard way. (−25)", "terra"); render(); } },
    ], EVENT_SRCS.illness);
  });
  add(2, () => {
    SND.event();
    showModal("Cracked Axle", "The wagon lurches — an axle has split on the rocks.", [
      { label: "FIT A SPARE (" + S.spares + " LEFT)", primary: true, disabled: S.spares <= 0, fn: () => { S.spares--; log("A spare axle goes on. Rolling again by noon.", "olive"); SND.good(); render(); } },
      { label: "RIG A REPAIR (2 DAYS)", fn: () => { log("Two days lost lashing the axle back together.", "dim"); dayTick(false); if (!S.over) dayTick(false); } },
    ], EVENT_SRCS.brokenAxle);
  });
  if (S.mile > 200) add(2, () => {
    SND.event();
    showModal("Riders on the Ridge", "Three riders block the trail ahead, hands resting easy on their belts.", [
      { label: "PAY THEM OFF (25 GOLD)", disabled: S.gold < 25, fn: () => { S.gold -= 25; log("They count the coin and let you pass.", "dim"); render(); } },
      { label: "STAND YOUR GROUND", primary: true, fn: () => {
          if (Math.random() < 0.5) { log("They lose their nerve and scatter. Nothing lost.", "olive"); SND.good(); }
          else { S.food = Math.max(0, S.food - 40); const m = pick(alive()); hurt(m, 15); if (!S.over) log("A scuffle. 40 lb of food gone and " + m.name + " is bruised.", "terra"); SND.bad(); }
          render();
        } },
    ]);
  });
  if (!mountains) add(2, () => { const f = ri(20, 35); S.food += f; log("Wild berries along a creek bed. +" + f + " lb food.", "olive"); SND.good(); });
  add(2, () => {
    const roll = Math.random();
    if (roll < 0.34) { S.spares++; log("An abandoned wagon — you salvage a spare axle.", "olive"); }
    else if (roll < 0.6) { S.meds++; log("An abandoned wagon — a sealed tonic in the chest.", "olive"); }
    else { const f = ri(20, 40); S.food += f; log("An abandoned wagon — " + f + " lb of sound flour.", "olive"); }
    SND.good();
  });
  add(2, () => { S.mile += 6; log("Firm ground and a tailwind. Bonus miles.", "olive"); });
  if (mountains) add(2, () => { const m = pick(alive()); hurt(m, 15); if (!S.over) log("A rattler strikes from the scree. " + m.name + " −15.", "terra"); SND.bad(); });
  add(1, () => { S.mile = Math.max(0, S.mile - 4); log("Wheel-swallowing ruts. You backtrack to find a better line.", "dim"); });

  pick(table)();
};

// ---- Rivers -----------------------------------------------------------------
const riverModal = (lm) => {
  SND.event();
  const depth = lm.depth.toFixed(1);
  showModal(lm.name, "The water runs <b>" + depth + " ft deep</b>. The far bank looks a long way off.", [
    { label: "FORD THE RIVER", primary: true, fn: () => {
        const pFail = Math.min(0.75, Math.max(0.05, (lm.depth - 2.5) * 0.28));
        if (Math.random() < pFail) {
          const f = ri(30, 60);
          S.food = Math.max(0, S.food - f);
          const m = pick(alive());
          hurt(m, 20);
          if (Math.random() < 0.3 && S.spares > 0) { S.spares--; log("The current rolls the wagon — " + f + " lb of food and a spare lost. " + m.name + " half-drowned.", "terra"); }
          else if (!S.over) log("The current rolls the wagon — " + f + " lb of food gone. " + m.name + " half-drowned.", "terra");
          SND.bad();
        } else {
          log("You pick the shallows well. Across, bone-dry.", "olive");
          SND.good();
          if (lm.depth >= 3) fire("river-runner");
        }
        if (!S.over) dayTick(false);
      } },
    { label: "TAKE THE FERRY (30 GOLD)", disabled: S.gold < 30, fn: () => { S.gold -= 30; log("The ferryman poles you across without a splash.", "dim"); dayTick(false); } },
    { label: "WAIT FOR LOWER WATER (1 DAY)", fn: () => { lm.depth = Math.max(2.2, lm.depth - 0.45); dayTick(false); if (!S.over) riverModal(lm); } },
  ], EVENT_SRCS.river);
};

// ---- Fort trade -----------------------------------------------------------------
const tradeModal = () => {
  const rows = [
    { label: "20 LB FOOD — 8 GOLD", cost: 8, fn: () => { S.food += 20; } },
    { label: "SPARE AXLE — 25 GOLD", cost: 25, fn: () => { S.spares++; } },
    { label: "BITTERROOT TONIC — 20 GOLD", cost: 20, fn: () => { S.meds++; } },
  ];
  showModal(S.atFort.name + " Trading Post", "Gold on hand: <b>" + S.gold + "</b>. The shelves are dusty but stocked.",
    rows.map((r) => ({ label: r.label, disabled: S.gold < r.cost, fn: () => { S.gold -= r.cost; r.fn(); SND.buy(); render(); tradeModal(); } }))
      .concat([{ label: "BACK TO THE TRAIL", primary: true, fn: () => { render(); } }]), EVENT_SRCS.fort);
};

// ---- Hunt -----------------------------------------------------------------
let huntRaf = null;
const huntModal = () => {
  halt();
  const m = $("modal");
  m.innerHTML = "<img class='event-art' src='" + EVENT_SRCS.hunt + "' alt=''>" +
    "<h2>Hunting</h2><div class='body'>Steady… squeeze when the marker crosses the green.</div>" +
    "<div id='hunttrack'>" +
    "<div class='zone z-ok' style='left:25%;width:50%'></div>" +
    "<div class='zone z-good' style='left:38%;width:24%'></div>" +
    "<div class='zone z-perfect' style='left:47%;width:6%'></div>" +
    "<div id='huntmarker'></div></div>" +
    "<div class='choices'><button class='btn primary' id='huntFire' type='button'>FIRE</button></div>";
  $("overlay").classList.add("open");

  const marker = $("huntmarker");
  const t0 = performance.now();
  let pos = 0;
  const sweep = (t) => {
    pos = (Math.sin((t - t0) / 260) + 1) / 2;
    marker.style.left = (pos * 100) + "%";
    huntRaf = requestAnimationFrame(sweep);
  };
  huntRaf = requestAnimationFrame(sweep);

  const resolve = () => {
    cancelAnimationFrame(huntRaf);
    huntRaf = null;
    closeModal();
    SND.shot();
    const off = Math.abs(pos - 0.5);
    let food, msg;
    if (off <= 0.03) { food = 80; msg = "A clean shot. A fat elk — +80 lb."; fire("sharp-eye"); }
    else if (off <= 0.12) { food = 50; msg = "A solid hit. Venison for days — +50 lb."; }
    else if (off <= 0.25) { food = 25; msg = "Winged a hare or two. +25 lb."; }
    else { food = 8; msg = "Powder wasted. A skinny grouse — +8 lb."; }
    S.food += food;
    log(msg, food >= 50 ? "olive" : "dim");
    if (food >= 50) SND.good();
    dayTick(false);
  };
  $("huntFire").onclick = resolve;
  window._huntResolve = resolve;
};

// ---- End -----------------------------------------------------------------
const endGame = (arrived) => {
  if (S.over) return;
  S.over = true;
  halt();
  closeModal();
  if (huntRaf) cancelAnimationFrame(huntRaf);

  const survivors = alive().length;
  const totalHp = alive().reduce((a, p) => a + p.hp, 0);
  let score;
  if (arrived) {
    score = survivors * 500 + totalHp * 2 + S.food + S.gold * 2 + (S.spares + S.meds) * 40 + Math.max(0, (110 - S.day) * 12);
    fire("golden-valley");
    if (survivors === 5) fire("no-one-left");
    if (S.day < 70) fire("swift-wheels");
    SND.arrive();
    log("Golden Valley. You made it.", "mustard");
  } else {
    score = S.mile * 2;
    log("The trail claims the whole party on day " + S.day + ".", "terra");
  }
  score = Math.max(0, Math.round(score));

  post({ type: "ARCADE_SCORE", score, stats: { days: S.day, survivors, miles: S.mile, food: S.food, gold: S.gold } });

  const m = $("modal");
  m.innerHTML = (arrived ? '<img class="event-art" src="' + EVENT_SRCS.arrival + '" alt="">' : "") +
    "<h2>" + (arrived ? "GOLDEN VALLEY" : "THE TRAIL WINS") + "</h2>" +
    "<div class='body endnums'>" +
    (arrived ? "You rolled in on day <b>" + S.day + "</b> with <b>" + survivors + "</b> of five alive." : "Every member of the party is gone. Day <b>" + S.day + "</b>, mile <b>" + S.mile + "</b>.") +
    "<br>SURVIVOR SCORE: <b>" + score.toLocaleString() + "</b></div>";
  $("overlay").classList.add("open");
  render();
};

// ---- Render -----------------------------------------------------------------
const segButtons = (el, defs, current, onPick) => {
  el.innerHTML = "";
  defs.forEach((d, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "pill" + (i === current ? " on" : "");
    b.textContent = d.name.toUpperCase();
    b.onclick = () => { onPick(i); render(); };
    el.appendChild(b);
  });
};

const REGIONS = [
  { start: 0, end: 290 },
  { start: 290, end: 640 },
  { start: 640, end: 900 },
  { start: 900, end: END },
];
let panoW = 0;
let activeRegion = 0;
let activeRegionLayer = 0;

const layoutPano = () => {
  const scene = $("scene");
  panoW = scene.clientWidth * 1.38;
  $("regionA").style.backgroundSize = panoW + "px auto";
  $("regionB").style.backgroundSize = panoW + "px auto";
  positionPano();
};

const regionIndexAt = (mile) => {
  const index = REGIONS.findIndex((region) => mile >= region.start && mile < region.end);
  return index < 0 ? REGIONS.length - 1 : index;
};

const switchRegion = (nextRegion) => {
  if (nextRegion === activeRegion) return;
  const oldLayer = $(activeRegionLayer === 0 ? "regionA" : "regionB");
  activeRegionLayer = 1 - activeRegionLayer;
  const nextLayer = $(activeRegionLayer === 0 ? "regionA" : "regionB");
  activeRegion = nextRegion;
  nextLayer.style.backgroundImage = "url('" + REGION_SRCS[nextRegion] + "')";
  nextLayer.style.opacity = "1";
  oldLayer.style.opacity = "0";
};

const positionPano = () => {
  const scene = $("scene");
  const sw = scene.clientWidth;
  const nextRegion = Math.max(0, regionIndexAt(S.mile));
  switchRegion(nextRegion);
  const region = REGIONS[nextRegion];
  const progress = Math.max(0, Math.min(1, (S.mile - region.start) / (region.end - region.start)));
  const x = -(progress * Math.max(0, panoW - sw));
  const layer = $(activeRegionLayer === 0 ? "regionA" : "regionB");
  layer.style.backgroundPosition = x + "px 100%";
};

const render = () => {
  $("tDay").textContent = S.day;
  $("tMile").textContent = S.mile;
  $("tGold").textContent = S.gold;
  $("tFood").textContent = S.food;
  $("tFood").className = S.food > 60 ? "olive" : S.food > 0 ? "mustard" : "terra";
  $("tSpares").textContent = S.spares;
  $("tMeds").textContent = S.meds;
  $("weatherchip").textContent = S.weather.toUpperCase();
  $("scene").classList.toggle("gloom", S.wmod < 0.9);
  $("scene").classList.toggle("rolling", S.traveling);
  const sceneArt = S.atFort ? EVENT_SRCS.fort : S.weather === "Storm" ? EVENT_SRCS.storm : "";
  $("sceneEvent").src = sceneArt;
  $("scene").classList.toggle("event-mode", Boolean(sceneArt));
  positionPano();

  // trail
  $("tFill").style.width = (S.mile / END) * 100 + "%";
  const prev = [...LANDMARKS].reverse().find((l) => l.mile <= S.mile);
  const next = LANDMARKS.find((l) => l.mile > S.mile);
  $("tPrev").textContent = prev ? prev.name : "Split Creek";
  $("tNext").textContent = next ? next.name + " · " + (next.mile - S.mile) + " mi" : "";

  // party
  $("party").innerHTML = S.party.map((p) => {
    const cls = p.hp > 50 ? "" : p.hp > 25 ? "warn" : "low";
    return '<span class="member' + (p.alive ? "" : " dead") + '"><span class="nm">' + p.name + '</span>' +
      '<span class="hpbar"><i class="' + cls + '" style="width:' + p.hp + '%"></i></span></span>';
  }).join("");

  segButtons($("segPace"), PACES, S.pace, (i) => { S.pace = i; });
  segButtons($("segRat"), RATIONS, S.rations, (i) => { S.rations = i; });

  $("btnGo").textContent = S.traveling ? "HALT" : "SET OUT";
  $("btnGo").disabled = S.over;
  $("btnRest").disabled = S.over || S.traveling;
  $("btnHunt").disabled = S.over || S.traveling;
  $("btnTrade").style.display = S.atFort && !S.over ? "" : "none";
};

// ---- Ticks (drawn once) -----------------------------------------------------------------
const buildTicks = () => {
  const line = $("trackline");
  for (const lm of LANDMARKS) {
    const t = document.createElement("span");
    t.className = "tick";
    t.style.left = (lm.mile / END) * 100 + "%";
    t.dataset.mile = lm.mile;
    line.appendChild(t);
  }
};
const refreshTicks = () => {
  document.querySelectorAll(".tick").forEach((t) => {
    t.classList.toggle("done", S.mile >= Number(t.dataset.mile));
  });
};

// ---- Actions -----------------------------------------------------------------
$("btnGo").onclick = () => {
  if (S.over) return;
  if (S.traveling) { halt(); return; }
  if (!S.everSetOut) { S.everSetOut = true; fire("wheels-west"); log("The wagon creaks west out of Split Creek.", "mustard"); }
  if (S.atFort) { log("You leave " + S.atFort.name + " behind.", "dim"); S.atFort = null; }
  S.traveling = true;
  S.timer = setInterval(() => { dayTick(true); refreshTicks(); }, 640);
  render();
};
$("btnRest").onclick = () => {
  if (S.over || S.traveling || modalOpen()) return;
  for (const p of alive()) p.hp = Math.min(100, p.hp + 12);
  log("A day in camp. Everyone breathes easier.", "olive");
  dayTick(false);
};
$("btnHunt").onclick = () => { if (!S.over && !S.traveling && !modalOpen()) huntModal(); };
$("btnTrade").onclick = () => { if (S.atFort && !S.over && !modalOpen()) tradeModal(); };
$("mute").onclick = () => { muted = !muted; $("mute").textContent = muted ? "SOUND OFF" : "SOUND ON"; };

// A hidden tab must not keep burning trail days: a run could end unseen.
document.addEventListener("visibilitychange", () => {
  if (document.hidden && S.traveling && !S.over) halt();
});

window.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    e.preventDefault();
    if (huntRaf) { window._huntResolve(); return; }
    if (!modalOpen()) $("btnGo").onclick();
  } else if (e.code === "KeyM") {
    $("mute").onclick();
  }
});

// ---- Art ------------------------------------------------------------------
const loadImage = (src) => new Promise((resolve, reject) => {
  const image = new Image();
  image.onload = () => resolve(image);
  image.onerror = reject;
  image.src = src;
});

const buildWagonFrames = (image) => {
  const source = document.createElement("canvas");
  source.width = image.width;
  source.height = image.height;
  const sourceCtx = source.getContext("2d", { willReadFrequently: true });
  sourceCtx.drawImage(image, 0, 0);
  const keyed = sourceCtx.getImageData(0, 0, source.width, source.height);
  for (let i = 0; i < keyed.data.length; i += 4) {
    const r = keyed.data[i], g = keyed.data[i + 1], b = keyed.data[i + 2];
    if (r > 150 && b > 150 && g < 125) keyed.data[i + 3] = 0;
  }
  sourceCtx.putImageData(keyed, 0, 0);

  const trimmed = [];
  for (let frameIndex = 0; frameIndex < 4; frameIndex++) {
    const x0 = Math.floor((frameIndex * source.width) / 4);
    const x1 = Math.floor(((frameIndex + 1) * source.width) / 4);
    const cell = sourceCtx.getImageData(x0, 0, x1 - x0, source.height);
    let minX = cell.width, maxX = -1, minY = cell.height, maxY = -1;
    for (let y = 0; y < cell.height; y++) {
      for (let x = 0; x < cell.width; x++) {
        if (cell.data[(y * cell.width + x) * 4 + 3] < 16) continue;
        minX = Math.min(minX, x); maxX = Math.max(maxX, x);
        minY = Math.min(minY, y); maxY = Math.max(maxY, y);
      }
    }
    const frame = document.createElement("canvas");
    frame.width = Math.max(1, maxX - minX + 1);
    frame.height = Math.max(1, maxY - minY + 1);
    frame.getContext("2d").putImageData(
      sourceCtx.getImageData(x0 + minX, minY, frame.width, frame.height), 0, 0,
    );
    trimmed.push(frame);
  }

  const width = Math.max(...trimmed.map((frame) => frame.width));
  const height = Math.max(...trimmed.map((frame) => frame.height));
  return trimmed.map((frame) => {
    const normalized = document.createElement("canvas");
    normalized.width = width;
    normalized.height = height;
    normalized.getContext("2d").drawImage(frame, Math.round((width - frame.width) / 2), height - frame.height);
    return normalized.toDataURL("image/png");
  });
};

let wagonFrames = [];
let wagonFrame = 0;
setInterval(() => {
  if (!wagonFrames.length) return;
  wagonFrame = S.traveling ? (wagonFrame + 1) % wagonFrames.length : 0;
  $("wagon").src = wagonFrames[wagonFrame];
}, 140);

// ---- Boot -----------------------------------------------------------------
$("regionA").style.backgroundImage = "url('" + REGION_SRCS[0] + "')";
window.addEventListener("resize", layoutPano);

Promise.all([
  ...REGION_SRCS.map(loadImage),
  ...Object.values(EVENT_SRCS).map(loadImage),
  loadImage(WAGON_SHEET_SRC),
]).then((images) => {
  wagonFrames = buildWagonFrames(images[images.length - 1]);
  $("wagon").src = wagonFrames[0];
  layoutPano();
  render();
  post({ type: "ARCADE_READY" });
}).catch(() => {
  log("The trail art could not be loaded.", "terra");
  post({ type: "ARCADE_READY" });
});

buildTicks();
log("Split Creek, spring. 1,120 miles to Golden Valley. Five of you, one wagon.", "dim");
render();
</script>
</body>
</html>
